.top-title{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:600;color:#d4af37;margin-bottom:4px}
.top-sub{font-size:12px;color:#7aabcf}

.mtab.active{background:rgba(35,100,170,.6);border-color:rgba(100,160,220,.5);color:#d4af37;font-weight:700}

.cal-panel{display:none}
.cal-panel.active{display:block}

.cal-card{

  border:1px solid rgba(100,160,220,.2);border-radius:14px;overflow:hidden;

}

.whale-area{

}

.cal-inner{padding:14px}

.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.wd{text-align:center;font-size:10px;color:#5a8aaa;padding:3px 0;font-weight:700}
.wd.s{color:#c06060}.wd.ss{color:#6090c0}

.cell{

.cell:active{background:rgba(30,90,160,.5);transform:scale(0.97)}

function calcDiff(row) {
  const vals = [row[3],row[5],row[7],row[9]].filter(v=>v!=null&&v>-100);
  if(!vals.length) return 0;
  return Math.max(...vals) - Math.min(...vals);
}

// 물때 타입·월 → 추천 어종 3종 반환
function getFish(type, month) {
  const base = FISH_DB.base[type] || FISH_DB.base.n;
  const seas = FISH_DB.season[month] || [];
  // 시즌 어종을 1위로, 나머지는 base에서 채우되 중복 제거
  const result = [];
  for(const s of seas){
    if(result.length>=3) break;
    result.push(s);
  }
  for(const b of base){
    if(result.length>=3) break;
    if(!result.find(r=>r.n===b.n)) result.push(b);
  }
  return result.slice(0,3);
}

  const fish = getFish(type, month);

}

function renderMonth(m) {
  const data = RAW[m] || [];
  const wxList = WX_BY_MONTH[m] || [];
  const g = document.getElementById("grid-"+m);
  g.innerHTML = "";
  const fd = new Date(2026, m-1, 1).getDay();
  const dm = new Date(2026, m, 0).getDate();
  const today = new Date();

  for(let i=0;i<fd;i++){const e=document.createElement("div");e.className="cell emp";g.appendChild(e);}

  for(let d=1;d<=dm;d++){
    const row = data[d]; // 1-indexed
    const c = document.createElement("div");
    const dow = (fd+d-1)%7;
    const isT = today.getFullYear()===2026&&today.getMonth()===m-1&&today.getDate()===d;
    const isS = selMo===m&&selDay===d;
    const wx = wxList[d-1]||"맑음";

    let cls="cell";
    if(dow===0)cls+=" sun"; if(dow===6)cls+=" sat";
    if(isT)cls+=" tod"; if(isS)cls+=" sel";
    if(row){const tc=tclass(row[10]);if(tc)cls+=` ${tc}`;}
    c.className=cls;
    c.onclick=()=>pick(m,d);

    let h=`<div class="dn">${d}</div>`;
    if(row){
      const diff=calcDiff(row);
      h+=`<div class="lu">음력 ${row[0]}</div>`;
      h+=`<div class="tl ${tlclass(row[10])}">${temoji(row[10])} ${row[1]}</div>`;
      h+=fishTagsHtml(row[10], m);
      if(row[2]){h+=`<div class="mt"><span class="hi">▲${row[2]} ${row[3]}cm</span><br>`;}
      if(row[4]){h+=`<span class="lo">▼${row[4]} ${row[5]}cm</span>`;}
      h+=`</div>`;
      if(diff>0)h+=`<div class="df">조차 ${diff}cm</div>`;
      h+=`<div class="wx">${WX_ICONS[wx]||"🌤"} <span style="font-size:7px">${TEMP[m]||""}°</span></div>`;
    }
    c.innerHTML=h; g.appendChild(c);
  }

  if(selMo===m&&selDay&&data[selDay]) showDetail(m,selDay);
  else { const p=document.getElementById("dp-"+m); if(p)p.className="dp"; }
}

function pick(m,d){
  if(selMo===m&&selDay===d){selMo=null;selDay=null;document.getElementById("dp-"+m).className="dp";renderMonth(m);return;}
  selMo=m;selDay=d;renderMonth(m);
}

function showDetail(m,d){
  const row=RAW[m][d];
  const p=document.getElementById("dp-"+m);
  if(!row){p.className="dp";return;}
  const wx=WX_BY_MONTH[m]?.[d-1]||"맑음";
  const diff=calcDiff(row);
  const dow=["일","월","화","수","목","금","토"][(new Date(2026,m-1,d)).getDay()];
  const fs=fishScore(row[10],row[1]);
  const stars="★".repeat(fs)+"☆".repeat(5-fs);
  const sc=fs>=4?"#f5d76e":fs>=3?"#90caf9":"#ef9a9a";

  // 24시간 조위 곡선 — 만조/간조 제어점으로 스플라인 보간
  function toMin(ts){ if(!ts)return null; const [h,mn]=ts.split(":").map(Number); return h*60+mn; }
  const knots=[];
  if(row[2]&&row[3]!=null)knots.push({min:toMin(row[2]),v:row[3],type:"hi",label:row[2]});
  if(row[4]&&row[5]!=null)knots.push({min:toMin(row[4]),v:row[5],type:"lo",label:row[4]});
  if(row[6]&&row[7]!=null)knots.push({min:toMin(row[6]),v:row[7],type:"hi",label:row[6]});
  if(row[8]&&row[9]!=null)knots.push({min:toMin(row[8]),v:row[9],type:"lo",label:row[8]});
  knots.sort((a,b)=>a.min-b.min);

  // 24시간 양 끝 연속성 위해 전/후 가상 노드 추가
  const extended=[];
  if(knots.length>0){
    const last=knots[knots.length-1];
    extended.push({min:last.min-1440,v:last.v,type:last.type});
  }
  knots.forEach(k=>extended.push(k));
  if(knots.length>0){
    const first=knots[0];
    extended.push({min:first.min+1440,v:first.v,type:first.type});
  }

  // 코사인 보간: 인접 두 극값 사이 값
  function tideAt(minVal){
    for(let i=0;i<extended.length-1;i++){
      const a=extended[i], b=extended[i+1];
      if(minVal>=a.min&&minVal<=b.min){
        const t=(minVal-a.min)/(b.min-a.min);
        const ct=(1-Math.cos(t*Math.PI))/2;
        return a.v+(b.v-a.v)*ct;
      }
    }
    return knots.length?knots[0].v:500;
  }

  // SVG 좌표 계산
  const SVG_W=520, SVG_H=110, PAD_L=38, PAD_R=10, PAD_T=12, PAD_B=22;
  const plotW=SVG_W-PAD_L-PAD_R, plotH=SVG_H-PAD_T-PAD_B;
  const allVals=Array.from({length:145},(_,i)=>tideAt(i*10));
  const minV=Math.min(...allVals)-20, maxV2=Math.max(...allVals)+20;
  const range=maxV2-minV||1;
  function px(min){ return PAD_L+min/1440*plotW; }
  function py(v){ return PAD_T+plotH-(v-minV)/range*plotH; }

  // 경로 생성 (10분 간격)
  const pts2=Array.from({length:145},(_,i)=>({x:px(i*10),y:py(tideAt(i*10))}));
  let pathD=`M${pts2[0].x.toFixed(1)},${pts2[0].y.toFixed(1)}`;
  for(let i=1;i<pts2.length;i++) pathD+=` L${pts2[i].x.toFixed(1)},${pts2[i].y.toFixed(1)}`;
  const fillD=pathD+` L${px(1440).toFixed(1)},${(PAD_T+plotH).toFixed(1)} L${PAD_L.toFixed(1)},${(PAD_T+plotH).toFixed(1)} Z`;

  // X축 레이블 (0,3,6,...,24시)
  const xLabels=[0,3,6,9,12,15,18,21,24].map(h=>{
    const x=px(h*60);
    return `<text x="${x.toFixed(1)}" y="${SVG_H-4}" font-size="8" fill="#4a7a9b" text-anchor="middle">${h}</text>
            <line x1="${x.toFixed(1)}" y1="${PAD_T}" x2="${x.toFixed(1)}" y2="${(PAD_T+plotH).toFixed(1)}" stroke="rgba(100,160,220,.1)" stroke-width="0.5"/>`;
  }).join("");

  // Y축 레이블
  const ySteps=3;
  const yLabels=Array.from({length:ySteps+1},(_,i)=>{
    const v=Math.round(minV+range*i/ySteps);
    const y=py(v);
    return `<text x="${PAD_L-3}" y="${y.toFixed(1)}" font-size="7" fill="#4a7a9b" text-anchor="end" dominant-baseline="middle">${v}</text>
            <line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${(PAD_L+plotW).toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(100,160,220,.08)" stroke-width="0.5"/>`;
  }).join("");

  // 만조/간조 마커 및 레이블
  const markers=knots.map(k=>{
    const x=px(k.min), y=py(k.v);
    const col=k.type==="hi"?"#2196f3":"#ff7043";
    const anchor=k.type==="hi"?"middle":"middle";
    const dy=k.type==="hi"?-8:10;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${col}" stroke="#0a1628" stroke-width="1"/>
            <text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" font-size="7.5" fill="${col}" text-anchor="${anchor}" font-weight="bold">${k.label} ${k.v}cm</text>`;
  }).join("");

  // 현재 시각 라인 (오늘이면)
  const now=new Date(); let nowLine="";
  if(now.getFullYear()===2026&&now.getMonth()===m-1&&now.getDate()===d){
    const nm=now.getHours()*60+now.getMinutes();
    const nx=px(nm);
    nowLine=`<line x1="${nx}" y1="${PAD_T}" x2="${nx}" y2="${PAD_T+plotH}" stroke="#f5d76e" stroke-width="1.5" stroke-dasharray="3,2"/>
             <text x="${nx}" y="${PAD_T-2}" font-size="7" fill="#f5d76e" text-anchor="middle">지금</text>`;
  }

  const tideSvg=`<svg viewBox="0 0 ${SVG_W} ${SVG_H}" width="100%" xmlns="http://www.w3.org/2000/svg">
    ${yLabels}${xLabels}
    <defs>
      <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2196f3" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#2196f3" stop-opacity="0.05"/>
      </linearGradient>
    </defs>
    <path d="${fillD}" fill="url(#tg)"/>
    <path d="${pathD}" fill="none" stroke="#2196f3" stroke-width="1.8" stroke-linejoin="round"/>
    ${markers}${nowLine}
    <text x="${PAD_L+plotW/2}" y="${SVG_H-2}" font-size="7" fill="#3a6a8a" text-anchor="middle">시간 (시)</text>
    <text x="8" y="${PAD_T+plotH/2}" font-size="7" fill="#3a6a8a" text-anchor="middle" transform="rotate(-90,8,${PAD_T+plotH/2})">조위(cm)</text>
  </svg>`;

  const tiptxt = diff>900?"🔴 대조기 최강 — 사리, 전문가 권장":diff>700?"⬆ 대조기 — 조류 활발":diff>400?"● 중간 조차":diff>0?"🟡 소조기 — 조류 약":"—";

  p.innerHTML=`
    <div class="dph">
      <div>
        <div class="dpd">2026년 ${MN[m]} ${d}일 (${dow})</div>
        <div class="dpl">음력 ${row[0]} · ${row[1]}</div>
      </div>
      <button class="cb" onclick="closeDetail(${m})">닫기</button>
    </div>
    <div class="dbb">
      <div class="dbl">조차 (간만의 차)</div>
      <div class="dbv">${diff} cm</div>
      <div class="dbs">${tiptxt}</div>
    </div>
    <div class="dg">
      <div class="dc">
        <div class="dct">조석 정보</div>
        ${row[2]?`<div class="tr"><span class="tt">만조 1</span><span class="tm hi">${row[2]}</span><span class="th">${row[3]}cm</span></div>`:""}
        ${row[4]?`<div class="tr"><span class="tt">간조 1</span><span class="tm lo">${row[4]}</span><span class="th">${row[5]}cm</span></div>`:""}
        ${row[6]?`<div class="tr"><span class="tt">만조 2</span><span class="tm hi">${row[6]}</span><span class="th">${row[7]}cm</span></div>`:""}
        ${row[8]?`<div class="tr"><span class="tt">간조 2</span><span class="tm lo">${row[8]}</span><span class="th">${row[9]}cm</span></div>`:""}
      </div>
      <div class="dc">
        <div class="dct">날씨 예보</div>
        <div class="wr"><span class="wl">날씨</span><span>${WX_ICONS[wx]||"🌤"} ${wx}</span></div>
        <div class="wr"><span class="wl">기온</span><span>${TEMP[m]||""}°C</span></div>
        <div class="wr"><span class="wl">바람</span><span>${WIND[m]||""} m/s</span></div>
      </div>
    </div>
    <div class="hs">
      <div style="font-size:9px;color:#4a7a9b;margin-bottom:5px;letter-spacing:.3px">📈 24시간 조위 곡선 (코사인 보간)</div>
      <div style="background:rgba(6,14,30,.7);border:1px solid rgba(100,160,220,.15);border-radius:6px;padding:6px 4px 2px;">
        ${tideSvg}
      </div>
      <div style="display:flex;gap:12px;margin-top:4px;font-size:8px">
        <span style="color:#2196f3">● 만조</span>
        <span style="color:#ff7043">● 간조</span>
        <span style="color:#f5d76e">| 현재</span>
      </div>
    </div>
    <div class="fr">
      <div><div class="frl">낚시 적합도</div><div class="frt">${fishText(row[10],row[1])}</div></div>
      <div><div class="frs" style="color:${sc}">${stars}</div></div>
    </div>
    <div class="fish-section">
      <div class="fish-title">🎣 오늘의 추천 어종 TOP 3 (${MN[m]} · ${row[1]})</div>
      <div class="fish-list">
        ${getFish(row[10],m).map((f,i)=>{
          const medals=["🥇","🥈","🥉"];
          const nameColors=["#ffd060","#7acce8","#c0a8e8"];
          return `<div class="fish-item">
            <span class="fish-rank">${medals[i]}</span>
            <span class="fish-name" style="color:${nameColors[i]}">${f.i} ${f.n}</span>
            <span class="fish-desc">${f.d}</span>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;
  p.className="dp vis";
}

function closeDetail(m){selDay=null;selMo=null;document.getElementById("dp-"+m).className="dp";renderMonth(m);}

// 초기화
buildTabs();
buildPanels();
renderMonth(activeMo);

// ── 오늘 날짜로 자동 이동 ──────────────────────────────
(function(){
  const t = new Date();
  if(t.getFullYear()===2026){
    const m = t.getMonth()+1;
    if(m>=4&&m<=12){
      activeMo=m;
      document.querySelectorAll(".mtab").forEach((b,i)=>{
        b.className="mtab"+(MONTHS[i]===activeMo?" active":"");
      });
      MONTHS.forEach(mo=>document.getElementById("panel-"+mo).className="cal-panel"+(mo===activeMo?" active":""));
      renderMonth(activeMo);
      // 오늘 셀로 스크롤
      setTimeout(()=>{
        const todEl = document.querySelector(".cell.tod");
        if(todEl) todEl.scrollIntoView({behavior:"smooth",block:"center"});
      }, 300);
    }
  }
})();

// ── Service Worker 등록 ────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(r=>console.log('SW 등록 완료', r.scope))
      .catch(e=>console.log('SW 등록 실패', e));
  });
}

// ── 아이폰 홈 화면 추가 안내 배너 ──────────────────────
(function(){
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone === true;
  const dismissed = localStorage.getItem('pwa-banner-dismissed');
  if(isIOS && !isStandalone && !dismissed){
    const banner = document.createElement('div');
    banner.id = 'pwa-banner';
    banner.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <span style="font-size:26px;line-height:1">🌊</span>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:#d4af37;margin-bottom:3px">앱으로 설치하기</div>
          <div style="font-size:11px;color:#b0d0e8;line-height:1.5">
            Safari 하단 <strong style="color:#fff">공유 버튼</strong> 탭 →<br>
            <strong style="color:#fff">홈 화면에 추가</strong> 선택 →<br>
            이후엔 앱 아이콘만 클릭! 로그인 불필요 ✓
          </div>
        </div>
        <button onclick="document.getElementById('pwa-banner').style.display='none';localStorage.setItem('pwa-banner-dismissed','1')"
          style="background:none;border:none;color:#7aabcf;font-size:20px;cursor:pointer;padding:0;line-height:1">×</button>
      </div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:6px;font-size:11px;color:#7aabcf">
        <span style="font-size:16px">⬆️</span> Safari 주소창 아래 공유(□↑) 버튼을 누르세요
      </div>
    `;
    Object.assign(banner.style,{
      position:'fixed',bottom:'0',left:'0',right:'0',
      background:'linear-gradient(135deg,rgba(8,20,50,.97),rgba(13,40,85,.97))',
      border:'1px solid rgba(100,160,220,.3)',
      borderBottom:'none',
      padding:'14px 16px calc(14px + env(safe-area-inset-bottom))',
      zIndex:'9999',
      backdropFilter:'blur(12px)',
      WebkitBackdropFilter:'blur(12px)',
      boxShadow:'0 -4px 20px rgba(0,0,0,.5)',
    });
    document.body.appendChild(banner);
    // 5초 후 자동 숨김 (방해 안 되게)
    setTimeout(()=>{ if(banner) banner.style.transition='opacity .5s'; banner.style.opacity='0'; setTimeout(()=>banner.remove(),500); }, 8000);
  }
})();

// ── 스와이프로 월 전환 (터치 제스처) ──────────────────
(function(){
  let sx=0, sy=0;
  document.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0) chM(1); else chM(-1);
    }
  }, {passive:true});
})();
</script>
